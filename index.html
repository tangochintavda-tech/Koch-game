<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кликер</title>
<style>
:root{--ink:#fff3dc;--panel:rgba(40,24,10,.84);--btn:#f2a93b;--btnink:#3a2208;--dis:#7a6a58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--panel:rgba(26,15,6,.88)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1a0c;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#2a1a0c}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;background:var(--btn);color:var(--btnink);font-weight:700;font-size:20px;font-family:inherit;padding:14px 22px;box-shadow:0 4px 0 #a86a14;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a14}
.btn:disabled,.btn.g{background:var(--dis);box-shadow:0 4px 0 #4a3e32;color:#d8cbb8}
.btn.g:active{box-shadow:0 1px 0 #4a3e32}
.pill{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px}
#menu{align-items:center;justify-content:center;gap:9vh;padding:6vh 20px;background:rgba(0,0,0,.28)}
#logo{width:94%;max-height:34vh;object-fit:contain;filter:drop-shadow(0 10px 14px #000a)}
#menu .col{display:flex;flex-direction:column;gap:14px;width:75%}
#top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;touch-action:manipulation}
#char{height:88%;max-width:92%;object-fit:contain;filter:drop-shadow(0 12px 16px #000a);pointer-events:none;transform-origin:50% 100%}
#char.b,#acc.b,#aw.b{animation:bump .14s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07,.95)}100%{transform:scale(1)}}
.fl{position:fixed;font-weight:800;font-size:28px;color:#ffe27a;text-shadow:0 2px 0 #6b3c0c,0 0 8px #000;pointer-events:none;animation:up .8s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
#bar{display:flex;gap:10px;padding:12px 14px 16px;justify-content:center}
#shop{background:rgba(0,0,0,.55)}
#shop .box{margin:auto 0 0;background:var(--panel);border-radius:22px 22px 0 0;padding:14px;max-height:88%;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px}
.list{overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px}
.card img{height:84px;width:60px;object-fit:contain}
.card .t{flex:1;font-size:15px;line-height:1.3}.card .t b{font-size:17px}
.card .btn{font-size:16px;padding:10px 14px;white-space:nowrap}
.sec{font-size:14px;opacity:.8;margin-top:4px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}.hd>span:last-child{display:flex;align-items:center;gap:6px}
#cd{flex:none;height:8px;width:60%;margin:0 auto 4px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
#cd i{display:block;height:100%;background:var(--btn);border-radius:4px}
#cd i.go{animation:cdf .5s linear}
@keyframes cdf{from{width:0}to{width:100%}}
.bi{width:44px;height:44px;margin:0 8px;flex:none;color:var(--btn)}
#pbox{flex:none;margin:0 14px 4px;padding:7px 12px 9px;border-radius:14px;background:var(--panel);font-size:14px;font-weight:700}
#ptxt{display:flex;justify-content:space-between;gap:8px}
#pbar{height:6px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--btn);border-radius:3px;transition:width .15s}

#char.h,#acc.h,#aw.h{animation:lvhop .9s ease-out}
@keyframes lvhop{0%{transform:scale(1)}18%{transform:scale(1.1,.88)}42%{transform:translateY(-7%) scale(.96,1.08)}60%{transform:scale(1.06,.94)}78%{transform:scale(.99,1.02)}100%{transform:scale(1)}}
#pbox.pu{animation:lvpu 1s ease-out}
@keyframes lvpu{0%,100%{box-shadow:0 0 0 0 rgba(255,226,122,0);transform:scale(1)}25%{box-shadow:0 0 22px 4px rgba(255,226,122,.85);transform:scale(1.04)}}
#lvfx{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(20,10,0,.1),rgba(20,10,0,.6));animation:lvx 3s ease-in-out forwards}
@keyframes lvx{0%{opacity:0}8%,78%{opacity:1}100%{opacity:0}}
#lvfx>*{position:absolute}
.lvf{inset:0;background:#fff3c4;animation:lvfl .7s ease-out both}
@keyframes lvfl{from{opacity:.45}to{opacity:0}}
.lvg,.lvr{left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%}
.lvg{background:radial-gradient(circle,rgba(255,236,160,.95) 0,rgba(242,169,59,.5) 22%,transparent 58%);animation:lvgl 1.4s ease-out both}
@keyframes lvgl{from{transform:scale(.15);opacity:1}to{transform:scale(1);opacity:.5}}
.lvr{background:repeating-conic-gradient(rgba(255,226,122,.5) 0 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:lvrs 10s linear both,lvri .8s .1s ease-out both}
@keyframes lvrs{to{transform:rotate(120deg)}}
@keyframes lvri{from{opacity:0}to{opacity:1}}
.lvc{left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px}
.lvb{position:relative;width:168px;height:168px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 26%,#fff3c4 0,#ffd45c 26%,#f2a93b 62%,#c98616 100%);border:6px solid #a86a14;color:#3a2208;overflow:hidden;box-shadow:0 0 0 7px rgba(255,226,122,.35),0 0 50px 12px rgba(255,200,60,.65),inset 0 -10px 0 rgba(168,106,20,.4);animation:lvpop .75s cubic-bezier(.18,1.45,.4,1) both,lvbeat .45s 1.05s ease-out}
@keyframes lvpop{from{transform:scale(0) rotate(-35deg);opacity:0}20%{opacity:1}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes lvbeat{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
.lvb::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid rgba(168,106,20,.5)}
.lvb::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:lvsh .9s .8s ease-in-out both}
@keyframes lvsh{to{left:130%}}
.lvb small{font-size:15px;font-weight:800;letter-spacing:.14em;margin-top:6px}
.lvn{height:80px;min-width:100px;overflow:hidden;text-align:center}
.lvn>div{animation:lvn .55s .55s cubic-bezier(.3,.9,.3,1) both}
.lvn span{display:block;height:80px;line-height:80px;font-size:74px;font-weight:900;text-shadow:0 2px 0 rgba(255,243,196,.8)}
@keyframes lvn{to{transform:translateY(-50%)}}
.lvt{display:flex;align-items:center;gap:7px;padding:9px 20px;border-radius:999px;background:linear-gradient(#ffe27a,#f2a93b);color:#3a2208;font-weight:800;font-size:19px;box-shadow:0 4px 0 #a86a14,0 8px 18px rgba(0,0,0,.45);animation:lvup .55s .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lvup{from{transform:translateY(26px) scale(.7);opacity:0}to{transform:none;opacity:1}}
#lvfx>i,#lvfx>svg{left:50%;top:40%;animation:lvpt 1.9s var(--dl) both}
#lvfx>i{width:var(--s);height:calc(var(--s)*.6);background:var(--c);border-radius:2px}
#lvfx>i.st{height:var(--s);border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
#lvfx>svg{width:var(--s);height:var(--s)}
@keyframes lvpt{0%{transform:translate(-50%,-50%) scale(0);opacity:1;animation-timing-function:cubic-bezier(.1,.8,.3,1)}40%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(calc(var(--r)*.5));opacity:1;animation-timing-function:ease-in}100%{transform:translate(calc(-50% + var(--x)*1.15),calc(-50% + var(--y) + 160px)) scale(.6) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){#lvfx>i,#lvfx>svg,.lvr,.lvf{display:none}#char.h{animation:none}.lvb,.lvt,.lvn>div{animation-duration:.01s;animation-delay:0s}}
#char{position:relative;z-index:1}
#aw{position:absolute;z-index:0;pointer-events:none;transform-origin:50% 100%;display:none}
#aw img{width:100%;height:100%;display:block}
#aw img.ap{animation:ap 1.8s ease-in-out infinite}
#aw img.rb{animation:rb 4s linear infinite}
@keyframes ap{0%,100%{filter:drop-shadow(0 0 6px var(--ac)) drop-shadow(0 0 16px var(--ac))}50%{filter:drop-shadow(0 0 12px var(--ac)) drop-shadow(0 0 34px var(--ac))}}
@keyframes rb{0%,100%{filter:drop-shadow(0 0 8px #f33) drop-shadow(0 0 26px #f33)}17%{filter:drop-shadow(0 0 8px #fb3) drop-shadow(0 0 26px #fb3)}33%{filter:drop-shadow(0 0 8px #ee3) drop-shadow(0 0 26px #ee3)}50%{filter:drop-shadow(0 0 8px #3e6) drop-shadow(0 0 26px #3e6)}67%{filter:drop-shadow(0 0 8px #3af) drop-shadow(0 0 26px #3af)}83%{filter:drop-shadow(0 0 8px #b4f) drop-shadow(0 0 26px #b4f)}}
#acc{position:absolute;z-index:2;pointer-events:none;transform-origin:50% 100%}
.card.ac{flex-direction:column;align-items:stretch;gap:8px}
.r1{display:flex;align-items:center;gap:12px}
.sw{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sw i{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.3);cursor:pointer}
.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--btn)}
.sw.d i{opacity:.35;pointer-events:none}
.sw .btn{font-size:14px;padding:7px 11px}
.gr{display:flex;align-items:center;gap:10px;font-size:14px}.gr input{flex:1}
.scr{z-index:0}#shop,#promo,#admin{z-index:1}
#pbtn{position:absolute;top:12px;left:12px;z-index:2;padding:9px 14px;font-size:16px}
#promo{background:rgba(0,0,0,.55);justify-content:center;align-items:center;padding:20px}
#promo .box{width:100%;background:var(--panel);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
#pin{font:inherit;font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--btn);background:rgba(255,255,255,.1);color:var(--ink);user-select:text;-webkit-user-select:text;outline:none}
#pmsg{min-height:1.3em;font-size:15px;text-align:center}
#admin{background:rgba(0,0,0,.55);justify-content:center;align-items:center;padding:20px}
#admin .box{width:100%;max-height:90%;background:var(--panel);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
</style>
</head>
